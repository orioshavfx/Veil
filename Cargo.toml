[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
edition = "2024"
version = "1.0.0-beta.2"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
futures = "0.3"
sha2 = "0.10"
md-5 = "0.10"
hkdf = "0.12"
hmac = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
directories = "6"
async-trait = "0.1"
aes = "0.8"
sha3 = "0.10"
crc32fast = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
ml-kem = "0.3"
veil-config = { path = "crates/veil-config" }
veil-proto = { path = "crates/veil-proto" }
veil-engine = { path = "crates/veil-engine" }
veil-sysproxy = { path = "crates/veil-sysproxy" }
veil-helper = { path = "crates/veil-helper" }

[patch.crates-io]
# See vendor/README.md.
ipstack = { path = "vendor/ipstack" }
