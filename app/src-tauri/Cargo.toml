[package]
name = "veil-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
veil-config.workspace = true
veil-engine.workspace = true
veil-helper.workspace = true
veil-proto.workspace = true
veil-sysproxy.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

# In-app updates from GitHub Releases: macOS only (the Windows build is a portable zip).
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-updater = "2.14"

[dev-dependencies]
base64.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
