<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veil</title>
  <link rel="stylesheet" href="popover.css">
</head>
<body>
  <main class="panel" id="hero">
    <button class="power" id="power" type="button" aria-label="Connect">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8M6.3 6.8a8 8 0 1 0 11.4 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="status" id="status">Disconnected</div>
    <div class="server" id="server">No server selected</div>
    <div class="cur-ping" id="cur-ping"><span class="dot unknown" id="cur-dot"></span><span id="cur-ms">—</span></div>
    <p class="error" id="error" hidden></p>

    <div class="list" id="list" role="listbox" aria-label="Pinned servers"></div>

    <footer>
      <button type="button" id="open">Open Veil</button>
      <button type="button" id="quit">Quit</button>
    </footer>
  </main>
  <script src="popover.js"></script>
</body>
</html>
