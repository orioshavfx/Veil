name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Helper binary (the app crate expects it as a sidecar at build time)
        run: |
          TRIPLE=$(rustc -vV | awk '/^host:/{print $2}')
          cargo build -p veil-helper --locked
          mkdir -p app/src-tauri/binaries
          cp target/debug/veil-helper "app/src-tauri/binaries/veil-helper-$TRIPLE"
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Release scripts
        run: |
          python3 app/tools/make-latest-json.py --self-test
          bash -n app/build.sh && bash -n app/tools/gen-update-key.sh
          cargo test --locked --manifest-path app/tools/update-sig-check/Cargo.toml

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: System packages (Tauri / GTK / WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Helper binary (the app crate expects it as a sidecar at build time)
        run: |
          TRIPLE=$(rustc -vV | awk '/^host:/{print $2}')
          cargo build -p veil-helper --locked
          mkdir -p app/src-tauri/binaries
          cp target/debug/veil-helper "app/src-tauri/binaries/veil-helper-$TRIPLE"
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --locked -- -D warnings
      - name: Tests (crates without a GUI first)
        run: cargo test --locked -p veil-proto -p veil-config -p veil-engine -p veil-sysproxy -p veil-helper -p veil-cli
      - run: cargo test --workspace --locked
      - name: Linux scripts
        run: bash -n app/build-linux.sh

  windows:
    runs-on: windows-latest
    continue-on-error: true # Windows is experimental
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p veil-proto -p veil-config -p veil-engine -p veil-sysproxy -p veil-cli

  licenses:
    runs-on: ubuntu-latest
    continue-on-error: true # the license allow-list in deny.toml is new
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
